<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000">
  <defs>
    <style>
      .blue { fill: #003da5; }
      .stroke-blue { fill: none; stroke: #003da5; stroke-width: 22; stroke-miterlimit: 10; }
      .gear-tooth { fill: #003da5; }
      .gear-ring { fill: none; stroke: #003da5; stroke-width: 10; }
      .inner-circle { fill: #ffffff; stroke: #003da5; stroke-width: 8; }
      .laurel { fill: none; stroke: #003da5; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .tools { fill: #003da5; }
      .label { fill: #003da5; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 58px; }
      .year { fill: #003da5; font-family: Arial, Helvetica, sans-serif; font-size: 46px; }
    </style>

    <!-- Arc path for curved CTEVT text -->
    <path id="ctevt-arc" d="M 280 520 A 170 170 0 0 1 620 520" fill="none" />
  </defs>

  <!-- Outer six-pointed star (single path with stroke) -->
  <path class="stroke-blue" d="M450,40 L582,226 L792,226 L620,360 L688,566 L450,450 L212,566 L280,360 L108,226 L318,226 Z" />

  <!-- Gear with 24 teeth -->
  <g transform="translate(0,0)">
    <!-- outer gear ring (thin stroke) -->
    <circle cx="450" cy="320" r="160" class="gear-ring" />

    <!-- teeth: 24 small rectangles positioned around the circle -->
    <g>
      <!-- generate 24 teeth by manual transforms -->
      <g class="gear-tooth">
        <rect x="446" y="142" width="8" height="30" rx="2" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(15 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(30 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(45 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(60 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(75 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(90 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(105 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(120 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(135 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(150 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(165 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(180 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(195 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(210 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(225 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(240 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(255 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(270 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(285 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(300 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(315 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(330 450 320)" />
        <rect x="446" y="142" width="8" height="30" rx="2" transform="rotate(345 450 320)" />
      </g>
    </g>

    <!-- inner white circle to hold the central emblem -->
    <circle cx="450" cy="320" r="128" class="inner-circle" />
  </g>

  <!-- Laurel wreath (left + right mirrored) -->
  <g>
    <!-- left branch (multiple small leaf strokes) -->
    <g transform="translate(0,0)">
      <path class="laurel" d="M370 250 C350 270 340 295 340 320 C340 345 350 370 370 385" />
      <path class="laurel" d="M370 270 C360 285 355 300 355 320 C355 340 360 355 370 370" />
      <path class="laurel" d="M370 290 C365 300 362 310 362 320 C362 330 365 340 370 350" />
    </g>
    <!-- right branch mirrored -->
    <g transform="scale(-1,1) translate(-900,0)">
      <path class="laurel" d="M370 250 C350 270 340 295 340 320 C340 345 350 370 370 385" />
      <path class="laurel" d="M370 270 C360 285 355 300 355 320 C355 340 360 355 370 370" />
      <path class="laurel" d="M370 290 C365 300 362 310 362 320 C362 330 365 340 370 350" />
    </g>
    <!-- bottom connecting laurel curve -->
    <path class="laurel" d="M365 375 C420 420 480 420 535 375" />
  </g>

  <!-- Central tools: pen/scriber (diagonal) and wrench (horizontal) -->
  <g transform="translate(0,0)">
    <!-- pen/scriber: detailed path rotated -->
    <g transform="rotate(-22 450 260)">
      <path class="tools" d="M445 160 L455 160 L470 235 L435 240 Z" />
      <rect x="448" y="235" width="4" height="40" rx="2" class="tools" />
      <circle cx="460" cy="150" r="6" class="tools" />
    </g>

    <!-- wrench: horizontal centered -->
    <g>
      <path class="tools" d="M330 330 C360 310 540 310 570 330 C560 345 440 345 430 345 C420 345 300 345 290 330 Z" />
      <!-- simple open-end shapes at both ends -->
      <path class="tools" d="M320 338 C312 350 312 370 320 382 C330 392 350 392 360 382 L365 376 C355 368 342 360 330 338 Z" />
      <path class="tools" d="M560 338 C568 350 568 370 560 382 C550 392 530 392 520 382 L515 376 C525 368 538 360 560 338 Z" />
    </g>
  </g>

  <!-- Curved CTEVT text along arc under gear -->
  <text class="label" text-anchor="middle">
    <textPath href="#ctevt-arc" startOffset="50%">CTEVT</textPath>
  </text>

  <!-- Year placed inside lower star point -->
  <text x="450" y="710" text-anchor="middle" class="year">1989</text>

</svg>
