<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTEVT Certificate</title>
    <style>
        :root{
            --primary: #003da5;
            --muted: #666;
            --bg: #f5f5f5;
            --container-padding: 60px 40px;
            --max-width: 900px;
        }

        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        .certificate-container{
            width: 100%;
            max-width: var(--max-width);
            background-color: #fff;
            padding: var(--container-padding);
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            text-align: center;
            border: 3px solid var(--primary);
        }

        header.header{
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
            display:flex;
            gap:20px;
            align-items:center;
            justify-content:center;
            flex-wrap:wrap;
        }

        .logo{
            width: 86px;
            height: 86px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* Ensure raster/logo fits nicely */
        .logo img, .logo svg{
            max-width: 100%;
            max-height: 100%;
            display:block;
            height: auto;
            width: auto;
        }

        .org-title{
            color: var(--primary);
            font-weight: bold;
            font-size: 22px;
            line-height:1.05;
        }

        .org-subtitle{
            color:#333;
            font-size:14px;
            margin-top:6px;
            font-weight:500;
        }

        main.content{
            margin: 36px 0;
            text-align: left;
        }

        .cert-title{
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:var(--primary);
            margin-bottom:18px;
        }

        dl.info-list{
            display:grid;
            grid-template-columns: 200px 1fr;
            gap:18px 24px;
            align-items:center;
            margin: 0 auto;
            max-width:720px;
        }

        dt.info-label{
            color:var(--primary);
            font-weight:700;
            font-size:16px;
        }

        dd.info-value{
            margin:0;
            font-size:16px;
            color:#333;
            padding-left:6px;
        }

        .status-badge{
            display:inline-block;
            background:#4caf50;
            color:#fff;
            padding:8px 14px;
            border-radius:6px;
            font-weight:700;
            font-size:14px;
        }

        footer.footer{
            margin-top:44px;
            padding-top:24px;
            border-top:2px solid var(--primary);
            color:var(--muted);
            font-size:13px;
            text-align:center;
        }

        @media (max-width:640px){
            dl.info-list{
                grid-template-columns: 1fr;
            }

            header.header{
                padding: 10px 0;
            }

            .org-title{
                font-size:18px;
            }
        }

        @media print{
            body{background:#fff}
            .certificate-container{box-shadow:none;max-width:100%;border:none}
            header.header{border-bottom:1px solid var(--primary)}
        }
    </style>
</head>
<body>
    <div class="certificate-container" role="document" aria-label="CTEVT Certificate">
        <header class="header">
            <div class="logo">
                <img src="CTEVT.png" alt="CTEVT logo" />
            </div>
            <div>
                <div class="org-title">Council for Technical Education and Vocational Training</div>
                <div class="org-subtitle">Sanothimi, Kathmandu, Nepal</div>
            </div>
        </header>

        <main class="content">
            <h1 class="cert-title">Certificate of Completion</h1>

            <dl class="info-list" aria-labelledby="cert-info">
                <dt id="cert-info" class="info-label">Student Name</dt>
                <dd class="info-value">Atish Kumar Mandal</dd>

                <dt class="info-label">Course</dt>
                <dd class="info-value">Diploma in Civil Engineering</dd>

                <dt class="info-label">Status</dt>
                <dd class="info-value"><span class="status-badge" aria-live="polite">Approved</span></dd>
            </dl>
        </main>

        <footer class="footer">
            <p>&copy; <span id="year"></span> Council for Technical Education and Vocational Training. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // set current year dynamically
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
